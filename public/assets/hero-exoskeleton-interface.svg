<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Editorial Hero Artwork: Untethered Ankle Exoskeleton Human-Device Interface</title>
  <desc>Original technical vector illustration showing the lower limb in late-stance push-off wearing an untethered ankle exoskeleton (Slade et al., 2022), highlighting the waist battery supply, below-knee calf cuff, shank-mounted brushless motor and drum, Vectran cable transmission, heel spur with strain-gauge bridge, and carbon-fiber sole plate.</desc>
  <defs>
    <pattern id="hero-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
    <linearGradient id="hero-glow-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1019" />
      <stop offset="55%" stop-color="#111A2E" />
      <stop offset="100%" stop-color="#0B1019" />
    </linearGradient>
    <marker id="hero-arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFD166" />
    </marker>
    <marker id="hero-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#00E5FF" />
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#hero-glow-bg)" />
  <rect width="1200" height="675" fill="url(#hero-grid)" />

  <circle cx="650" cy="410" r="220" fill="none" stroke="#9D4EDD" stroke-width="1.5" stroke-dasharray="10 8" stroke-opacity="0.55" />
  <circle cx="650" cy="410" r="145" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="4 6" stroke-opacity="0.4" />
  <line x1="80" y1="590" x2="1120" y2="590" stroke="#334155" stroke-width="2.5" />

  <g transform="translate(56, 58)" font-family="system-ui, -apple-system, sans-serif">
    <text x="0" y="0" fill="#00E5FF" font-size="13" font-weight="700" font-family="monospace">ARCHITECTURAL STAGE // SLADE ET AL. (2022) + SIVIY ET AL. (2023)</text>
    <text x="0" y="36" fill="#F8FAFC" font-size="28" font-weight="700">EXOSKELETON HUMAN-DEVICE INTERFACE</text>
    <text x="0" y="66" fill="#CBD5E1" font-size="17" font-weight="500">Attachment, load transfer, alignment, 200 Hz sensing, and actuation</text>

    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="335" height="154" rx="10" fill="#0F172A" fill-opacity="0.92" stroke="#1E293B" stroke-width="1.5" />
      <text x="16" y="26" fill="#94A3B8" font-size="11.5" font-weight="700" font-family="monospace">EXPLANATORY COLOR &amp; LINE SYSTEM</text>
      <line x1="16" y1="48" x2="54" y2="48" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#hero-arrow-cyan)" />
      <text x="66" y="52" fill="#E2E8F0" font-size="13">200 Hz Sensor &amp; Control Signals</text>
      <line x1="16" y1="78" x2="54" y2="78" stroke="#FFD166" stroke-width="3.5" marker-end="url(#hero-arrow-gold)" />
      <text x="66" y="82" fill="#E2E8F0" font-size="13">Actuation, Force &amp; Torque Paths</text>
      <rect x="16" y="98" width="38" height="14" rx="3" fill="#9D4EDD" fill-opacity="0.25" stroke="#9D4EDD" stroke-width="1.5" stroke-dasharray="4 2" />
      <text x="66" y="110" fill="#E2E8F0" font-size="13">Controller &amp; System Boundaries</text>
      <rect x="16" y="124" width="38" height="12" rx="2" fill="#334155" stroke="#94A3B8" stroke-width="1.5" />
      <text x="66" y="135" fill="#CBD5E1" font-size="13">Schematic Anatomy &amp; Frame Struts</text>
    </g>
  </g>

  <g transform="translate(650, 445)">
    <g transform="rotate(14)">
      <path d="M -56 -295 C -64 -195, -50 -90, -34 -12 L 38 -12 C 56 -90, 68 -195, 58 -295 Z" fill="#1E293B" fill-opacity="0.7" stroke="#475569" stroke-width="2" />
      <path d="M -22 -285 L -14 -18 L 14 -18 L 20 -285 Z" fill="#334155" stroke="#94A3B8" stroke-width="1.8" />
      <path d="M -38 -275 L -32 -22 L -24 -22 L -28 -275 Z" fill="#273549" stroke="#64748B" stroke-width="1.4" />
      <rect x="-64" y="-262" width="136" height="36" rx="6" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
      <rect x="28" y="-266" width="22" height="44" rx="4" fill="#475569" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 44 -275 L 58 -275 L 52 -8 L 36 -8 Z" fill="#0F172A" stroke="#F8FAFC" stroke-width="2.2" />
      <rect x="55" y="-215" width="46" height="62" rx="5" fill="#131B2E" stroke="#9D4EDD" stroke-width="2" />
      <circle cx="76" cy="-112" r="28" fill="#1E293B" stroke="#FFD166" stroke-width="2.5" />
      <circle cx="76" cy="-112" r="14" fill="#0F172A" stroke="#F8FAFC" stroke-width="1.8" />
      <line x1="86" y1="-100" x2="92" y2="16" stroke="#FFD166" stroke-width="4" />
      <line x1="28" y1="-244" x2="-36" y2="-244" stroke="#FFD166" stroke-width="3.5" marker-end="url(#hero-arrow-gold)" />
    </g>

    <g transform="rotate(-18)">
      <path d="M -75 15 C -82 42, -78 80, -56 96 L 175 96 C 196 96, 204 76, 185 60 L 52 18 Z" fill="#1E293B" stroke="#64748B" stroke-width="2" />
      <path d="M -48 22 L 22 22 L 118 72 L -44 76 Z" fill="#334155" stroke="#94A3B8" stroke-width="1.5" />
      <rect x="-56" y="82" width="222" height="8" rx="3" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.8" />
      <path d="M 42 0 L 136 84 L 120 88 L 30 6 Z" fill="#0F172A" stroke="#E2E8F0" stroke-width="2" />
      <path d="M 40 -4 L 94 16 L 88 26 L 34 8 Z" fill="#0F172A" stroke="#E2E8F0" stroke-width="2.2" />
      <rect x="58" y="1" width="15" height="5" rx="1.5" fill="#00E5FF" />
      <rect x="55" y="11" width="15" height="5" rx="1.5" fill="#00E5FF" />
      <line x1="90" y1="16" x2="90" y2="-52" stroke="#FFD166" stroke-width="4" marker-end="url(#hero-arrow-gold)" />
    </g>

    <circle cx="42" cy="0" r="12" fill="#0F172A" stroke="#00E5FF" stroke-width="2.5" />
    <circle cx="42" cy="0" r="4" fill="#FFD166" />
    <circle cx="-6" cy="-5" r="9" fill="#9D4EDD" fill-opacity="0.35" stroke="#E9D5FF" stroke-width="1.8" stroke-dasharray="3 2" />
    <path d="M 68 8 C 115 -35, 122 -120, 102 -165" fill="none" stroke="#00E5FF" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#hero-arrow-cyan)" />
  </g>
</svg>
