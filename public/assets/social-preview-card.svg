<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="system-ui, -apple-system, sans-serif">
  <title>EXOSKELETON HUMAN-DEVICE INTERFACE  Social Preview Card</title>
  <defs>
    <pattern id="og-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1019" />
      <stop offset="60%" stop-color="#111A2E" />
      <stop offset="100%" stop-color="#0B1019" />
    </linearGradient>
    <marker id="og-arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFD166" />
    </marker>
    <marker id="og-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#00E5FF" />
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-grid)" />
  <rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="#1E293B" stroke-width="2" />

  <g transform="translate(64, 88)">
    <rect x="0" y="0" width="410" height="34" rx="17" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5" />
    <text x="18" y="22" fill="#00E5FF" font-size="13" font-weight="700" font-family="monospace">WEARABLE ASSISTIVE ROBOTICS // EXPLAINER</text>

    <text x="0" y="88" fill="#F8FAFC" font-size="42" font-weight="800">EXOSKELETON</text>
    <text x="0" y="138" fill="#F8FAFC" font-size="42" font-weight="800">HUMANDEVICE</text>
    <text x="0" y="188" fill="#00E5FF" font-size="42" font-weight="800">INTERFACE</text>

    <text x="0" y="242" fill="#CBD5E1" font-size="20" font-weight="500">How attachment, structure, sensing, and actuation</text>
    <text x="0" y="270" fill="#CBD5E1" font-size="20" font-weight="500">connect a wearable robot to a moving person.</text>

    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="540" height="128" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="32" fill="#FFD166" font-size="14" font-weight="700" font-family="monospace">34s DETERMINISTIC MOTION EXPLAINER (1,020 FRAMES @ 30 FPS)</text>
      <text x="20" y="62" fill="#E2E8F0" font-size="15">" Documented Untethered Ankle Architecture (Slade et al., 2022)</text>
      <text x="20" y="88" fill="#E2E8F0" font-size="15">" Shear-Free Normal Force Reaction &amp; 200 Hz Sensor Fusion</text>
      <text x="20" y="112" fill="#94A3B8" font-size="13" font-family="monospace">Sources: Nature (PMC9556303) | Nat. Biomed. Eng. (PMC11536595)</text>
    </g>
  </g>

  <g transform="translate(880, 425)">
    <circle cx="0" cy="-40" r="195" fill="none" stroke="#9D4EDD" stroke-width="1.5" stroke-dasharray="10 8" stroke-opacity="0.6" />
    <line x1="-210" y1="125" x2="210" y2="125" stroke="#334155" stroke-width="3" />

    <g transform="rotate(14)">
      <path d="M -52 -265 C -60 -175, -46 -80, -30 -10 L 34 -10 C 50 -80, 62 -175, 52 -265 Z" fill="#1E293B" stroke="#475569" stroke-width="2" />
      <path d="M -20 -255 L -12 -16 L 12 -16 L 18 -255 Z" fill="#334155" stroke="#94A3B8" stroke-width="1.8" />
      <rect x="-58" y="-235" width="124" height="32" rx="6" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
      <path d="M 40 -248 L 54 -248 L 48 -8 L 32 -8 Z" fill="#0F172A" stroke="#F8FAFC" stroke-width="2.2" />
      <rect x="50" y="-195" width="42" height="56" rx="5" fill="#131B2E" stroke="#9D4EDD" stroke-width="2" />
      <circle cx="70" cy="-102" r="25" fill="#1E293B" stroke="#FFD166" stroke-width="2.5" />
      <circle cx="70" cy="-102" r="12" fill="#0F172A" stroke="#F8FAFC" stroke-width="1.8" />
      <line x1="78" y1="-90" x2="84" y2="14" stroke="#FFD166" stroke-width="4" />
      <line x1="25" y1="-218" x2="-35" y2="-218" stroke="#FFD166" stroke-width="3.5" marker-end="url(#og-arrow-gold)" />
    </g>

    <g transform="rotate(-18)">
      <path d="M -68 14 C -74 38, -70 72, -50 88 L 158 88 C 178 88, 184 70, 168 54 L 46 16 Z" fill="#1E293B" stroke="#64748B" stroke-width="2" />
      <rect x="-50" y="75" width="200" height="8" rx="3" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.8" />
      <path d="M 38 0 L 122 76 L 108 80 L 28 6 Z" fill="#0F172A" stroke="#E2E8F0" stroke-width="2" />
      <path d="M 36 -4 L 86 14 L 80 24 L 30 8 Z" fill="#0F172A" stroke="#00E5FF" stroke-width="2.2" />
      <line x1="82" y1="14" x2="82" y2="-48" stroke="#FFD166" stroke-width="4" marker-end="url(#og-arrow-gold)" />
    </g>

    <circle cx="38" cy="0" r="11" fill="#0F172A" stroke="#00E5FF" stroke-width="2.5" />
    <circle cx="38" cy="0" r="4" fill="#FFD166" />
    <path d="M 62 8 C 105 -30, 110 -110, 92 -150" fill="none" stroke="#00E5FF" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#og-arrow-cyan)" />
  </g>
</svg>
